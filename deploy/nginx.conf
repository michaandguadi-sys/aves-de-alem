server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
  location ~ \.webmanifest$ { default_type application/manifest+json; add_header Cache-Control "no-cache"; }
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location ~* \.(png|svg)$ { add_header Cache-Control "public, max-age=604800"; }
  location /deploy/ { return 404; }
  location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ =404; }
}
